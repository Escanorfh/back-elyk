version: '3.8'

services:
  livekit:
    image: livekit/livekit-server:latest
    command: --config /etc/livekit.yaml
    ports:
      - "7880:7880"
      - "7881:7881"
      - "50000-50010:50000-50010/udp"
    volumes:
      - ./livekit.yaml:/etc/livekit.yaml
    depends_on:
      - redis
    network_mode: host

  redis:
    image: redis:alpine
    ports:
      - "6379:6379"

  coturn:
    image: coturn/coturn
    command: turnserver -a -o -v -n -u turnuser:turnpassword -p 3478 -L 0.0.0.0 -X $(curl ifconfig.me) --no-dtls --no-tls
    ports:
      - "3478:3478"
      - "3478:3478/udp"
    network_mode: host
