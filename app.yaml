kind: wasmer.io/App.v0
name: back-elyk
app_id: da_K6AIot5U1o3w
owner: escanorfh
package: .
locality:
  regions:
  - fr-roub1
env:
  APP_RUNNING_IN_CONSOLE: 'false'
  APP_ENV: production
  APP_DEBUG: 'false'
  LOG_CHANNEL: stderr
  LOG_LEVEL: error
  APP_KEY: base64:9NaPiBBcAPrMQhgAq7A4HDcQRy3cR+ZBb8NX1OC3+vc=
  DB_CONNECTION: mysql
  SESSION_DRIVER: database
  CACHE_STORE: database
  QUEUE_CONNECTION: database
  BROADCAST_CONNECTION: log
  FILESYSTEM_DISK: local
  # Wasmer's container filesystem is wiped on deploy; uploads live on the
  # volume mounted below instead of storage/app/public.
  PUBLIC_DISK_ROOT: /data
  INSTAPAY_PAYMENT_LINK: "https://ipn.eg/S/emanyasso123./instapay/775D3W"
  CORS_ALLOWED_ORIGINS: '*'
  APP_URL: https://back-elyk.wasmer.app
volumes:
- name: media
  mount: /data
capabilities:
  database:
    engine: mysql
debug: false
scaling:
  mode: single_concurrency
jobs:
- name: laravel-database-migrations
  trigger: post-deployment
  timeout: 5m
  action:
    execute:
      command: php
      cli_args:
      - artisan
      - migrate
      - --force
annotations:
  anybuild.run/config:
    composer_build_script: post-update-cmd
    composer_enable: true
    name: out
    node_build_command: npm run build
    node_install_inputs:
    - package.json
    node_package_manager: npm
    npm_version: '11'
    php_framework: laravel
    php_public_dir: public
    phpix: true
  anybuild.run/provider: laravel
  anybuild.run/version: 0.33.2
  wasmer.io/version: 7.5.0
enableDatabase: true
enable_email: true
